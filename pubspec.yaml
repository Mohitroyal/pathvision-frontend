name: jarvis_os
description: A pixel-perfect Flutter replication of JARVIS OS - Personal & Company Operating System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.5+1
  intl: ^0.19.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
